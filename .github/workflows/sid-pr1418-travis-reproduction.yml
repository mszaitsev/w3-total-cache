name: Reproduce Travis PR 1418 checks

on:
  push:
    branches:
      - ci/sid-pr1418-travis-reproduction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: PHP ${{ matrix.php }} full suite
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, mysqli, curl, zip, gd, intl
          coverage: none
          tools: composer:v2
      - name: Environment and syntax
        run: |
          php -v
          php -l PgCache_ContentGrabber.php
          composer --version
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1
      - name: Full PHPUnit suite
        run: vendor/bin/phpunit --debug --verbose --no-coverage
      - name: Multisite PHPUnit suite
        run: WP_MULTISITE=1 vendor/bin/phpunit --group multisite --no-coverage
      - name: PHP lint
        run: find . -name vendor -prune -o -name node_modules -prune -o -name '*.php' -exec php -lf {} \; > /dev/null
